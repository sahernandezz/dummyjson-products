<section class="detail">
  <!-- Breadcrumb -->
  <nav class="detail__breadcrumb" aria-label="Navegación">
    <a routerLink="/" class="detail__breadcrumb-link">Catálogo</a>
    @if (product(); as p) {
      <span class="detail__breadcrumb-sep" aria-hidden="true">›</span>
      <a [routerLink]="['/']" [queryParams]="{ category: p.category }"
         class="detail__breadcrumb-link detail__breadcrumb-link--cat">
        {{ p.category }}
      </a>
      <span class="detail__breadcrumb-sep" aria-hidden="true">›</span>
      <span class="detail__breadcrumb-current">{{ p.title }}</span>
    }
  </nav>

  @if (isLoading()) {
    <app-detail-skeleton></app-detail-skeleton>
  } @else if (hasError()) {
    <div class="detail__error">
      <span class="detail__error-icon">😕</span>
      <h2>Producto no encontrado</h2>
      <p>No pudimos cargar este producto. <a routerLink="/">Volver al catálogo</a></p>
    </div>
  } @else if (product(); as p) {
    <div class="detail__content">
      <!-- Galería de imágenes -->
      <div class="detail__gallery">
        <app-image-carousel
          [images]="p.images"
          [alt]="p.title">
        </app-image-carousel>
      </div>

      <!-- Información del producto -->
      <div class="detail__info">
        <app-product-info
          [product]="p"
          (addToCart)="onAddToCart()">
        </app-product-info>
      </div>
    </div>

    <!-- Sección inferior: dimensiones y reseñas -->
    <div class="detail__extra">
      <app-product-dimensions
        [dimensions]="p.dimensions"
        [weight]="p.weight">
      </app-product-dimensions>

      <app-product-reviews
        [reviews]="p.reviews">
      </app-product-reviews>
    </div>

    <!-- Productos relacionados -->
    <app-related-products
      [category]="p.category"
      [excludeId]="p.id">
    </app-related-products>
  }
</section>
