@if (!isLoading() && products().length > 0) {
  <section class="related">
    <div class="related__header">
      <div class="related__title-block">
        <span class="related__eyebrow">También te puede gustar</span>
        <h2 class="related__title">Más en {{ category }}</h2>
      </div>

      <div class="related__nav">
        <button class="related__nav-btn" (click)="scrollLeft()" aria-label="Anterior">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
          </svg>
        </button>
        <button class="related__nav-btn" (click)="scrollRight()" aria-label="Siguiente">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="related-scroll" class="related__scroll">
      @for (product of products(); track product.id) {
        <div class="related__item">
          <app-product-card
            [product]="product"
            (addToCart)="onAddToCart($event)">
          </app-product-card>
        </div>
      }
    </div>
  </section>
}
