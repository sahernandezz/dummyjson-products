<!-- Overlay -->
@if (cartService.isCartOpen()) {
  <div class="cart-overlay" (click)="cartService.closeCart()" aria-hidden="true"></div>
}

<!-- Sidebar -->
<aside class="cart-sidebar" [class.cart-sidebar--open]="cartService.isCartOpen()" aria-label="Carrito de compras">
  <div class="cart-sidebar__header">
    <h2 class="cart-sidebar__title">
      Tu carrito
      @if (cartService.totalItems() > 0) {
        <span class="cart-sidebar__title-count">{{ cartService.totalItems() }}</span>
      }
    </h2>
    <button class="cart-sidebar__close" (click)="cartService.closeCart()" aria-label="Cerrar carrito">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="cart-sidebar__body">
    @if (cartService.items().length === 0) {
      <app-empty-state
        icon="🛒"
        title="Carrito vacío"
        message="Agrega productos desde el catálogo para verlos aquí.">
      </app-empty-state>
    } @else {
      <div class="cart-sidebar__items">
        @for (item of cartService.items(); track item.product.id) {
          <app-cart-item
            [item]="item"
            (increase)="onIncrease(item.product.id)"
            (decrease)="onDecrease(item.product.id)"
            (remove)="onRemove(item.product.id)">
          </app-cart-item>
        }
      </div>
    }
  </div>

  @if (cartService.items().length > 0) {
    <div class="cart-sidebar__footer">
      <app-cart-summary
        [totalItems]="cartService.totalItems()"
        [totalPrice]="cartService.totalPrice()">
      </app-cart-summary>

      <button class="cart-sidebar__clear-btn" (click)="onClearCart()">
        Vaciar carrito
      </button>
    </div>
  }
</aside>
