<article class="product-card">
  <!-- Imagen / Carrusel (interactivo, no navega) -->
  <div class="product-card__image-wrapper">
    <app-image-carousel
      [images]="product.images"
      [alt]="product.title">
    </app-image-carousel>

    @if (product.discountPercentage > 5) {
      <span class="product-card__badge">
        -{{ product.discountPercentage | number:'1.0-0' }}%
      </span>
    }

    @if (product.stock === 0) {
      <span class="product-card__badge product-card__badge--out">Agotado</span>
    }
  </div>

  <!-- Área clickeable que navega al detalle -->
  <a [routerLink]="['/product', product.id]" class="product-card__link">
    <div class="product-card__info">
      <span class="product-card__category">{{ product.category }}</span>
      <h3 class="product-card__title">{{ product.title }}</h3>

      <app-star-rating [rating]="product.rating"></app-star-rating>

      <div class="product-card__price-row">
        <span class="product-card__price">{{ product.price | currencyCop }}</span>
        <span class="product-card__stock" [class.product-card__stock--low]="product.stock < 10 && product.stock > 0">
          @if (product.stock > 0) { {{ product.stock }} disp. } @else { Sin stock }
        </span>
      </div>
    </div>
  </a>

  <!-- Botón agregar al carrito -->
  <button
    class="product-card__cart-btn"
    (click)="onAddToCart($event)"
    [disabled]="product.stock === 0"
    [attr.aria-label]="'Agregar ' + product.title + ' al carrito'">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="product-card__cart-icon">
      <path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"/>
    </svg>
    Agregar
  </button>
</article>
