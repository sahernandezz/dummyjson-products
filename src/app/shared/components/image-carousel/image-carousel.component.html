<div class="carousel">
  <div class="carousel__viewport">
    <img
      [appLazyImage]="images[currentIndex()]"
      [alt]="alt"
      class="carousel__image"
    />

    @if (images.length > 1) {
      <button class="carousel__btn carousel__btn--prev" (click)="prev()" aria-label="Imagen anterior">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
        </svg>
      </button>

      <button class="carousel__btn carousel__btn--next" (click)="next()" aria-label="Siguiente imagen">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
        </svg>
      </button>
    }
  </div>

  <!-- indicadores -->
  @if (images.length > 1) {
    <div class="carousel__dots">
      @for (img of images; track $index) {
        <button
          class="carousel__dot"
          [class.carousel__dot--active]="$index === currentIndex()"
          (click)="goTo($index)"
          [attr.aria-label]="'Ir a imagen ' + ($index + 1)">
        </button>
      }
    </div>
  }
</div>
